<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooting</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" width="640" height="900"></canvas>

    <div class="overlay" id="titleScreen">
      <h1>Space Shooting</h1>
      <p>移動・回避・射撃を学ぶ縦スクロールシューティング<br>
      A vertical-scrolling shooter where you learn to move, dodge and shoot.</p>
      <button id="startButton">PLAY</button>
      <button id="rankButton">VIEW RANKING</button>
    </div>

    <div class="overlay hidden" id="levelSelect">
      <h2>SELECT LEVEL</h2>
      <div class="levelButtons">
        <button class="levelButton" data-level="1">LEVEL 1</button>
        <button class="levelButton" data-level="2">LEVEL 2</button>
        <button class="levelButton" data-level="3">LEVEL 3</button>
      </div>
      <button id="backToTitle">Back to Title</button>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <h2>STAGE COMPLETE!</h2>
      <p id="finalMessage"></p>
      <p id="finalScore"></p>
      <label>Name<input id="playerName" maxlength="10" placeholder="PLAYER" /></label>
      <button id="saveScore">Save Score</button>
      <button id="retryButton">Try Again</button>
      <button id="backTitleFromGameOver">Back to Title</button>
    </div>

    <div class="overlay hidden" id="rankingScreen">
      <h2>Ranking</h2>
      <div class="ranking-tabs">
        <button class="ranking-tab-button" data-level="1">LEVEL 1</button>
        <button class="ranking-tab-button" data-level="2">LEVEL 2</button>
        <button class="ranking-tab-button" data-level="3">LEVEL 3</button>
      </div>
      <div class="ranking-area">
        <h3>Ranking</h3>
        <ol id="rankingList"></ol>
      </div>
      <button id="rankingBack">Back to Title</button>
    </div>

    <section id="hud">
      <div class="hud-row"><span id="hudLevel">LEVEL 1</span></div>
      <div class="hud-row"><span id="hudHp">HP: 10</span><span id="hudTime">TIME: 60</span></div>
      <div class="hud-row"><span id="hudScore">SCORE: 0</span></div>
      <div class="hud-row"><span id="hudStatus">移動(Move): ←→↑↓ / 射撃(Shoot): Z</span></div>
    </section>
  </div>

  <script type="module" src="../js/game.js"></script>
</body>
</html>
